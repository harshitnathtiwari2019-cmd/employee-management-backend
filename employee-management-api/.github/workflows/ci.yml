name: Employee Management API CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: employee_management_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d employee_management_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 3000
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/employee_management_ci
      JWT_ACCESS_SECRET: ci-test-secret-change-this-value-123456789
      JWT_ACCESS_TTL: 15m
      REFRESH_TOKEN_TTL_DAYS: 7
      CORS_ORIGINS: http://localhost:3000
      RATE_LIMIT_WINDOW_MS: 60000
      RATE_LIMIT_MAX_REQUESTS: 100

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Enable PostgreSQL UUID extension
        run: |
          PGPASSWORD=postgres psql \
            -h localhost \
            -U postgres \
            -d employee_management_ci \
            -c 'CREATE EXTENSION IF NOT EXISTS "uuid-ossp";'

      - name: Check TypeScript
        run: npm run typecheck

      - name: Build project
        run: npm run build

      - name: Run migrations on fresh database
        run: npm run migration:run

      - name: Run tests
        run: npm test
